[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "serpentype"
version = "0.1.0"
description = "Controlled HTML/CSS to PDF with paginated Rust layout"
requires-python = ">=3.10"
license = "MIT"

[project.optional-dependencies]
weasy-compat = ["Pillow>=10"]

[tool.maturin]
features = ["python"]
module-name = "serpentype._serpentype"
python-source = "."
include = ["serpentype/assets/**", "LICENSE", "README.md"]
