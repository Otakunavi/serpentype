[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "serpentype"
version = "0.9.1"
description = "Controlled HTML/CSS to PDF with paginated Rust layout"
requires-python = ">=3.10"
license = "MIT"

[project.urls]
Homepage = "https://github.com/Otakunavi/serpentype"
Documentation = "https://github.com/Otakunavi/serpentype/tree/main/docs"
Source = "https://github.com/Otakunavi/serpentype"

[project.optional-dependencies]
test-weasy = ["weasyprint==64.1"]

[tool.maturin]
features = ["python"]
module-name = "serpentype._serpentype"
python-source = "."
include = ["serpentype/assets/**", "LICENSE", "README.md"]
