[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "serpentype"
version = "0.11.0"
description = "Rust-powered HTML/CSS-to-PDF renderer for Python"
requires-python = ">=3.10"
license = "MIT"

[project.readme]
content-type = "text/markdown"
text = """
Serpentype turns HTML and CSS into paginated PDFs using a Rust layout engine.
It supports page backgrounds, headers, and footers, and provides WeasyPrint-style
`HTML` and `CSS` classes for a documented subset of HTML and CSS.
"""

[project.urls]
Homepage = "https://github.com/Otakunavi/serpentype"
Documentation = "https://github.com/Otakunavi/serpentype/tree/main/docs"
Source = "https://github.com/Otakunavi/serpentype"

[project.optional-dependencies]
test-weasy = ["weasyprint==64.1"]
test-pdfpipe = ["Jinja2>=3.1,<4", "weasyprint==64.1", "pypdf>=6,<7", "pypdfium2>=4,<6", "Pillow>=10,<13", "zxing-cpp>=2.3,<3"]

[tool.maturin]
features = ["python"]
module-name = "serpentype._serpentype"
python-source = "."
include = ["serpentype/assets/**", "LICENSE", "README.md"]
