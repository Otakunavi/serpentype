name: Publish release to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to publish
        required: true
        default: v0.5.0

permissions: {}

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Download release distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir dist
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" \
            --pattern '*.whl' --pattern '*.tar.gz' --dir dist

      - name: Check distribution names
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          assert tag.startswith('v')
          version = tag[1:]
          files = list(Path('dist').iterdir())
          # wheels.yml currently produces 7 native/manylinux/musllinux wheels.
          assert len(files) == 8, files
          wheels = [path.name for path in files if path.suffix == '.whl']
          assert len(wheels) == 7, wheels
          platforms = [
              ('manylinux', 'x86_64'),
              ('manylinux', 'aarch64'),
              ('musllinux', 'x86_64'),
              ('musllinux', 'aarch64'),
              ('macosx', 'x86_64'),
              ('macosx', 'arm64'),
              ('win_amd64',),
          ]
          assert all(any(all(part in wheel for part in platform) for wheel in wheels)
                     for platform in platforms), wheels
          assert any(path.name == f'serpentype-{version}.tar.gz' for path in files)
          assert all(path.name.startswith(f'serpentype-{version}') for path in files)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main'
    needs: collect
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/project/serpentype/
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist

      - name: Generate SBOM, provenance metadata and checksums
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/release_artifacts.py --artifacts dist --output release-artifacts --tag "$RELEASE_TAG"

      - name: Attest release distributions
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Upload release manifests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" release-artifacts/* --repo "$GH_REPO" --clobber

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
