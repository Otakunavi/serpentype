name: wheels and compatibility
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo test --no-default-features --locked
      - run: cargo clippy --no-default-features --locked --all-targets -- -D warnings

  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {name: manylinux-x86_64, os: ubuntu-22.04, target: x86_64, manylinux: '2_17', interpreter: python3.10, native: true}
          - {name: manylinux-aarch64, os: ubuntu-22.04, target: aarch64, manylinux: '2_17', interpreter: python3.10, native: false}
          - {name: musllinux-x86_64, os: ubuntu-22.04, target: x86_64, manylinux: musllinux_1_2, interpreter: python3.10, native: false}
          - {name: musllinux-aarch64, os: ubuntu-22.04, target: aarch64, manylinux: musllinux_1_2, interpreter: python3.10, native: false}
          - {name: macos-x86_64, os: macos-15-intel, target: x86_64, manylinux: auto, interpreter: python, native: true}
          - {name: macos-arm64, os: macos-15, target: aarch64, manylinux: auto, interpreter: python, native: true}
          - {name: windows-x86_64, os: windows-2022, target: x64, manylinux: auto, interpreter: python, native: true}
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          rust-toolchain: 1.98.1
          args: --release --locked --out dist -i ${{ matrix.platform.interpreter }}
      - name: Verify native wheel
        if: matrix.platform.native
        shell: bash
        run: |
          python -c 'import glob,subprocess,sys; w=glob.glob("dist/*.whl"); assert len(w)==1,w; subprocess.check_call([sys.executable,"-m","pip","install","--no-deps",w[0]])'
          python -I -c 'import serpentype; f=serpentype.FontRegistry(); f.register_file(serpentype.bundled_font_path(),family="Noto Sans"); d=serpentype.Renderer(fonts=f).layout("<p>Привет</p>"); assert d.page_count==1 and d.to_pdf().startswith(b"%PDF")'
      - name: Verify cross-platform deterministic PDF bytes
        if: matrix.platform.native
        run: python -I -c 'import hashlib,serpentype; f=serpentype.FontRegistry(); f.register_file(serpentype.bundled_font_path(),family="Noto Sans"); d=serpentype.Renderer(fonts=f).layout("<p>Repeatable PDF 2026</p>","@page { size:200pt 100pt; margin:10pt }"); assert hashlib.sha256(d.to_pdf()).hexdigest()=="2df1225a1772d9920d1059a3999f4b5cca511ad85f65fc82f4f17443bfd38a9a"'
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform.name }}
          path: dist/*.whl
          if-no-files-found: error

  python-abi3:
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-manylinux-x86_64
          path: dist
      - run: sudo apt-get update
      - run: sudo apt-get install -y poppler-utils
      - name: Install wheel and PDF test dependency
        run: |
          python -m pip install --no-deps dist/*.whl
          python -m pip install 'pypdf>=6,<7' 'Pillow>=10,<13'
      - name: Run mandatory Python compatibility suite against installed wheel
        run: |
          cd "$RUNNER_TEMP"
          python -I -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_*.py' -q
